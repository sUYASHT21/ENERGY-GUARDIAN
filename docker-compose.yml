# Smart Energy Guardian — full stack.
#   cp .env.example .env   # then edit secrets
#   docker compose up --build
# Dashboard: http://localhost:8080   API docs: http://localhost:8000/docs
services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/energy_guardian.db
      MODEL_DIR: /app/data/models
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - seg-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  seg-data:
