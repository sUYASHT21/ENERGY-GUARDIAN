name: Deploy backend to Hugging Face Space

# Free backend hosting (no credit card): pushes backend/ to a Docker Space on every push to main.
# Setup (once): GitHub repo -> Settings -> Secrets and variables -> Actions
#   Secret   HF_TOKEN  = a Hugging Face access token with "write" permission
#   Variable HF_SPACE  = <your-hf-username>/<space-name>, e.g. suyash/energy-guardian-api
on:
  push:
    branches: [main]
    paths: ["backend/**", "deploy/huggingface/**", ".github/workflows/deploy-hf-space.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push backend to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable not set - skipping deploy."
            exit 0
          fi
          HF_USER="${HF_SPACE%%/*}"
          mkdir staging
          cp -r backend/app backend/requirements.txt backend/Dockerfile backend/.dockerignore staging/
          cp deploy/huggingface/README.md staging/README.md
          cd staging
          git init -q -b main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
